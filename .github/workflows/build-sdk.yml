name: build-sdk

on:
  workflow_dispatch:
  push:
    tags:
      - sdk.**

permissions:
  contents: write

env:
  SDK_URL: https://downloads.immortalwrt.org/snapshots/targets/qualcommax/ipq60xx/immortalwrt-sdk-qualcommax-ipq60xx_gcc-14.4.0_musl.Linux-x86_64.tar.zst
  ARCH_TAG: aarch64_cortex-a53-SNAPSHOT
  PACKAGES: >-
    luci-app-lucky
    luci-app-homeproxy
    luci-app-substore
    luci-app-wolultra
    luci-app-adguardhome
    lucky
    sing-box
    node

jobs:
  build:
    name: build (standard SDK)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-distutils-extra rsync swig unzip \
            zlib1g-dev file wget zstd

      - name: Cache SDK downloads
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: sdk-dl-${{ env.ARCH_TAG }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            sdk-dl-${{ env.ARCH_TAG }}-

      - name: Download and extract SDK
        run: |
          wget -q "$SDK_URL" -O sdk.tar.zst
          mkdir -p sdk
          tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Setup custom feed
        working-directory: sdk
        run: |
          echo "src-link packages_ci $GITHUB_WORKSPACE" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select packages
        working-directory: sdk
        run: |
          for p in $PACKAGES; do
            echo "CONFIG_PACKAGE_${p}=m" >> .config
          done
          make defconfig

      - name: Build packages
        working-directory: sdk
        run: |
          make -j$(nproc) IGNORE_ERRORS=1 || make -j1 V=s

      - name: Collect artifacts
        run: |
          mkdir -p out
          find sdk/bin/packages -name "*.ipk" -exec cp {} out/ \; || true
          find sdk/bin/packages -name "*.apk" -exec cp {} out/ \; || true
          ls -la out/

      - name: Store packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ env.ARCH_TAG }}
          path: out/*

      - name: Zip packages
        run: |
          shopt -s nullglob
          zip -j ${{ env.ARCH_TAG }}.zip out/*.ipk out/*.apk
          echo "自用插件包 (标准SDK构建)" >> release.txt

      - name: Upload release
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "${{ env.ARCH_TAG }}.zip,out/*.ipk,out/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: "release.txt"
          tag: ${{ env.ARCH_TAG }}
          name: OpenWrt Packages (SDK) - ${{ env.ARCH_TAG }}
          makeLatest: true

      - name: Delete workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RETAIN_DAYS: "10"
          KEEP_MINIMUM_RUNS: "2"
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${RETAIN_DAYS} days ago" +%s)
          mapfile -t runs < <(
            gh run list \
              --repo "$REPO" \
              --workflow "$WORKFLOW_NAME" \
              --limit 200 \
              --json databaseId,createdAt \
              --jq '.[] | [.databaseId, .createdAt] | @tsv'
          )
          total=${#runs[@]}
          if [ "$total" -le "$KEEP_MINIMUM_RUNS" ]; then
            echo "No workflow runs to delete ($total <= $KEEP_MINIMUM_RUNS)"
            exit 0
          fi
          index=0
          for run in "${runs[@]}"; do
            index=$((index + 1))
            if [ "$index" -le "$KEEP_MINIMUM_RUNS" ]; then
              continue
            fi
            run_id=${run%%$'\t'*}
            created_at=${run#*$'\t'}
            created_epoch=$(date -u -d "$created_at" +%s)
            if [ "$created_epoch" -gt "$cutoff" ]; then
              continue
            fi
            echo "Deleting workflow run $run_id ($created_at)"
            gh api --method DELETE \
              "repos/$REPO/actions/runs/$run_id" || true
          done
