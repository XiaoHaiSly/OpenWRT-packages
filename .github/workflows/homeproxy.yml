name: Minimal SDK Build (luci-app-homeproxy)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Download & extract SDK
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/x86/64/immortalwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          wget -qO sdk.tar.zst "$SDK_URL"
          mkdir sdk
          tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Prepare feeds and Custom package
        working-directory: sdk
        run: |
          # 1. 必须拉取官方 feeds，否则会缺少 luci.mk 导致你的 Makefile 报错
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          # 2. 暴力删除官方同名包，解决你之前被“官方包顶替”的问题
          rm -rf feeds/luci/applications/luci-app-homeproxy
          rm -rf package/feeds/luci/luci-app-homeproxy

          # 3. 把你仓库里的源码放进 package 目录
          mkdir -p package/luci-app-homeproxy
          cp -r ../luci-app-homeproxy/* package/luci-app-homeproxy/

      - name: Compile the package
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_luci-app-homeproxy=y" > .config
          make defconfig
          make package/luci-app-homeproxy/compile V=s -j$(nproc)

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-homeproxy
          # 模糊匹配 bin 目录下生成的所有相关包 (自动兼容 apk/ipk)
          path: sdk/bin/**/luci-app-homeproxy*
