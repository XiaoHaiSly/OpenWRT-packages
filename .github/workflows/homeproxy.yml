name: Test SDK Build (luci-app-homeproxy)

# 手动触发。用真实的 ImmortalWrt SDK 走一遍
# 修复官方包冲突问题，确保100%使用本地仓库源码编译。
on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    name: Build luci-app-homeproxy

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Setup dependencies
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget zstd

      - name: Download & extract ImmortalWrt SDK (x86/64, snapshot)
        run: |
          SDK_URL="https://downloads.immortalwrt.org/snapshots/targets/x86/64/immortalwrt-sdk-x86-64_gcc-14.4.0_musl.Linux-x86_64.tar.zst"
          curl -fSL --retry 3 -o sdk.tar.zst "$SDK_URL"
          mkdir -p sdk
          tar --use-compress-program=unzstd -xf sdk.tar.zst -C sdk --strip-components=1

      - name: Update Feeds & Resolve Conflicts
        working-directory: sdk
        run: |
          echo "=== 1. 更新并安装所有官方 Feeds (为了补全依赖) ==="
          ./scripts/feeds update -a
          ./scripts/feeds install -a

          echo "=== 2. 核心修复：删除官方同名包，防止被 SDK 优先征用 ==="
          rm -rf feeds/luci/applications/luci-app-homeproxy
          rm -rf package/feeds/luci/luci-app-homeproxy
          echo "✅ 已清理官方 luci-app-homeproxy 源码"

      - name: Place custom package into SDK
        run: |
          echo "=== 将本地仓库源码放入 SDK/package/custom 目录 ==="
          mkdir -p sdk/package/custom/luci-app-homeproxy
          cp -r luci-app-homeproxy/* sdk/package/custom/luci-app-homeproxy/

          echo "=== 本次实际使用的 Makefile 内容 ==="
          cat sdk/package/custom/luci-app-homeproxy/Makefile

      - name: Generate config & Verify
        working-directory: sdk
        run: |
          make defconfig
          echo "CONFIG_PACKAGE_luci-app-homeproxy=y" >> .config
          make defconfig

          echo "=== 检查 .config 是否成功加载自定义包 ==="
          if grep -i "luci-app-homeproxy" .config; then
            echo "✅ 成功扫描到 luci-app-homeproxy"
          else
            echo "❌ 失败：.config 里没有 luci-app-homeproxy"
            exit 1 # 扫描不到直接停止，不要继续盲目编译
          fi

      - name: Build the package
        working-directory: sdk
        run: |
          echo "=== 开始编译 ==="
          # 去掉 || true，如果编译出错直接抛出红色异常，方便排错
          make package/luci-app-homeproxy/clean V=s
          make package/luci-app-homeproxy/compile V=s -j$(nproc) 2>&1 | tee ../build.log

      - name: Collect and Check Output
        run: |
          mkdir -p publish
          # 在 bin 目录下寻找所有的 apk 或 ipk 文件，统一提取到 publish 文件夹
          find sdk/bin/ -type f -name "luci-app-homeproxy*.*pk" -exec cp {} publish/ \;

          if [ "$(ls -A publish)" ]; then
            echo "✅ 成功找到生成的包文件："
            ls -lh publish/
          else
            echo "❌ bin/目录没有找到任何相关的 ipk/apk 包"
            exit 1
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload built package
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-homeproxy-package
          path: publish/*.*pk
          if-no-files-found: error
