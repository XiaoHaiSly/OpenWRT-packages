name: package-build-sdk

on:
  workflow_dispatch:
  push:
    tags:
      - sdk.**

permissions:
  contents: write

env:
  PACKAGES: >-
    luci-app-lucky
    luci-app-homeproxy
    luci-app-substore
    luci-app-wolultra
    luci-app-adguardhome
    lucky
    sing-box
    node

jobs:
  build:
    name: build ${{ matrix.arch_tag }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch_tag: aarch64_cortex-a53
            target: qualcommax
            subtarget: ipq60xx
          - arch_tag: x86_64
            target: x86
            subtarget: '64'

    env:
      SDK_BASE_URL: https://downloads.immortalwrt.org/snapshots/targets/${{ matrix.target }}/${{ matrix.subtarget }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-distutils-extra rsync swig unzip \
            zlib1g-dev file wget zstd

      - name: Resolve SDK archive
        id: sdk
        run: |
          curl -fsSL --retry 3 "$SDK_BASE_URL/sha256sums" -o sha256sums
          archive=""
          sha256=""
          while read -r sum name; do
            name="${name#\*}"
            if [[ "$name" == immortalwrt-sdk-*.Linux-x86_64.tar.zst ]]; then
              archive="$name"
              sha256="$sum"
              break
            fi
          done < sha256sums
          [[ -n "$archive" && -n "$sha256" ]]
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          echo "SDK 文件: $archive"

      - name: Cache SDK archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/immortalwrt-sdk/${{ matrix.arch_tag }}
          key: sdk-${{ matrix.arch_tag }}-${{ steps.sdk.outputs.sha256 }}

      - name: Download and extract SDK
        env:
          SDK_ARCHIVE: ${{ steps.sdk.outputs.archive }}
          SDK_SHA256: ${{ steps.sdk.outputs.sha256 }}
        run: |
          cache_dir="$HOME/.cache/immortalwrt-sdk/${{ matrix.arch_tag }}"
          archive_path="$cache_dir/$SDK_ARCHIVE"
          mkdir -p "$cache_dir"

          if [[ ! -f "$archive_path" ]] || \
             [[ "$(sha256sum "$archive_path" | cut -d' ' -f1)" != "$SDK_SHA256" ]]; then
            curl -fL --retry 3 "$SDK_BASE_URL/$SDK_ARCHIVE" -o "$archive_path"
          fi
          echo "$SDK_SHA256  $archive_path" | sha256sum -c -

          mkdir -p sdk
          tar --use-compress-program=unzstd -xf "$archive_path" -C sdk --strip-components=1

      - name: Cache package downloads
        uses: actions/cache@v4
        with:
          path: sdk/dl
          key: dl-${{ matrix.arch_tag }}-${{ hashFiles('**/Makefile') }}
          restore-keys: |
            dl-${{ matrix.arch_tag }}-

      - name: Setup custom feed
        working-directory: sdk
        run: |
          echo "src-link packages_ci $GITHUB_WORKSPACE" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Select packages
        working-directory: sdk
        run: |
          echo "CONFIG_ALL=n" > .config
          echo "CONFIG_ALL_KMODS=n" >> .config
          for p in $PACKAGES; do
            echo "CONFIG_PACKAGE_${p}=m" >> .config
          done
          make defconfig

      - name: Build packages
        working-directory: sdk
        run: |
          for p in $PACKAGES; do
            echo "==== building $p ===="
            make package/$p/compile V=s -j$(nproc) || make package/$p/compile V=s -j1
          done

      - name: Collect artifacts
        run: |
          mkdir -p out
          find sdk/bin/packages -name "*.ipk" -exec cp {} out/ \; || true
          find sdk/bin/packages -name "*.apk" -exec cp {} out/ \; || true
          ls -la out/

      - name: Store packages
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.arch_tag }}
          path: out/*

      - name: Zip packages
        run: |
          shopt -s nullglob
          zip -j ${{ matrix.arch_tag }}.zip out/*.ipk out/*.apk
          echo "自用插件包 (标准SDK构建)" >> release.txt

      - name: Upload release
        uses: ncipollo/release-action@v1.21.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          artifacts: "${{ matrix.arch_tag }}.zip,out/*.ipk,out/*.apk"
          allowUpdates: true
          replacesArtifacts: true
          bodyFile: "release.txt"
          tag: ${{ matrix.arch_tag }}
          name: OpenWrt Packages (SDK) - ${{ matrix.arch_tag }}
          makeLatest: true

      - name: Delete workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RETAIN_DAYS: "10"
          KEEP_MINIMUM_RUNS: "2"
        run: |
          set -euo pipefail
          cutoff=$(date -u -d "${RETAIN_DAYS} days ago" +%s)
          mapfile -t runs < <(
            gh run list \
              --repo "$REPO" \
              --workflow "$WORKFLOW_NAME" \
              --limit 200 \
              --json databaseId,createdAt \
              --jq '.[] | [.databaseId, .createdAt] | @tsv'
          )
          total=${#runs[@]}
          if [ "$total" -le "$KEEP_MINIMUM_RUNS" ]; then
            echo "No workflow runs to delete ($total <= $KEEP_MINIMUM_RUNS)"
            exit 0
          fi
          index=0
          for run in "${runs[@]}"; do
            index=$((index + 1))
            if [ "$index" -le "$KEEP_MINIMUM_RUNS" ]; then
              continue
            fi
            run_id=${run%%$'\t'*}
            created_at=${run#*$'\t'}
            created_epoch=$(date -u -d "$created_at" +%s)
            if [ "$created_epoch" -gt "$cutoff" ]; then
              continue
            fi
            echo "Deleting workflow run $run_id ($created_at)"
            gh api --method DELETE \
              "repos/$REPO/actions/runs/$run_id" || true
          done
